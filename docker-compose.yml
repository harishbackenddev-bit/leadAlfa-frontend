# ─────────────────────────────────────────────────────────────────────────────
# Creatrend Frontend — Docker Compose
#
# One compose file for BOTH staging and production on the same VPS.
# Isolation is controlled by .env values:
#
#   Staging (staging branch):  APP_ENV=staging     HOST_PORT=8091
#   Production (main branch):  APP_ENV=production  HOST_PORT=8092
#
# Nginx (host, outside Docker) proxies:
#   testing.creatrend.co.za  → 127.0.0.1:8091
#   creatrend.co.za          → 127.0.0.1:8092  (once production is set up)
# ─────────────────────────────────────────────────────────────────────────────

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_DOMAIN: ${VITE_DOMAIN}
        VITE_AUTH0_TENANT_DOMAIN: ${VITE_AUTH0_TENANT_DOMAIN}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
        VITE_CLIENT_ID: ${VITE_CLIENT_ID}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
        VITE_TURNSTILE_ENABLED: ${VITE_TURNSTILE_ENABLED}
        VITE_SOCIAL: ${VITE_SOCIAL}
        VITE_WP_API_URL: ${VITE_WP_API_URL}
        VITE_WP_SITE_URL: ${VITE_WP_SITE_URL}
        VITE_USE_S3_UPLOAD: ${VITE_USE_S3_UPLOAD}
        VITE_USE_CLOUDINARY_UPLOAD: ${VITE_USE_CLOUDINARY_UPLOAD}

    container_name: ${APP_ENV}-frontend

    restart: unless-stopped

    environment:
      WP_SITE_URL: ${VITE_WP_SITE_URL}

    ports:
      - "127.0.0.1:${HOST_PORT}:80"

    security_opt:
      - no-new-privileges:true

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
